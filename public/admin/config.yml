backend:
  name: github
  repo: manish-jsx/jobport-app
  branch: main
  local_backend: true
  base_url: https://jobs.backfills.ai/
  auth_endpoint: oauth
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "jobs"
    label: "Jobs"
    folder: "_jobs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Job ID", name: "job_id", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Location", name: "location", widget: "select", options: ["Dubai", "Gozo"]}
      - {label: "Discipline", name: "discipline", widget: "select", options: ["Retail", "Administration", "Driver", "Procurement", "Auditor", "Sales"]}
      - {label: "Salary", name: "salary", widget: "string", default: "Attractive"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Requirements", name: "requirements", widget: "markdown"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Status", name: "status", widget: "select", options: ["Open", "Closed"], default: "Open"}

  - name: "settings"
    label: "Settings"
    files:
      - file: "_data/company.yml"
        label: "Company Info"
        name: "company"
        fields:
          - {label: "Company Name", name: "name", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Address", name: "address", widget: "text"}
          - {label: "Social Links", name: "social", widget: "object", fields: [
              {label: "Facebook", name: "facebook", widget: "string"},
              {label: "Twitter", name: "twitter", widget: "string"},
              {label: "LinkedIn", name: "linkedin", widget: "string"}
            ]}